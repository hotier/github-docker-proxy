name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 前端构建
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      
      - name: Build Astro
        working-directory: frontend
        run: npm run build
      
      - name: Copy build output to static
        run: |
          rm -rf static/*
          cp -r frontend/dist/* static/
      
      - name: Upload static files
        uses: actions/upload-artifact@v4
        with:
          name: static-files
          path: static/
          retention-days: 1

  # 类型检查
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - name: Type check
        run: deno check main.ts

  # 测试
  test:
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - name: Download static files
        uses: actions/download-artifact@v4
        with:
          name: static-files
          path: static/
      
      - name: Run tests
        run: deno test --allow-net --allow-env --allow-read

  # 部署到 Deno Deploy
  deploy:
    runs-on: ubuntu-latest
    needs: [type-check, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - name: Download static files
        uses: actions/download-artifact@v4
        with:
          name: static-files
          path: static/
      
      - name: Install deployctl
        run: |
          deno install --allow-all --no-check -r -f https://deno.land/x/deploy@1.10.0/deployctl.ts
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
      
      - name: Deploy to Deno Deploy
        run: |
          deployctl deploy --project=${{ secrets.DENO_PROJECT }} --token=${{ secrets.DENO_DEPLOY_TOKEN }} main.ts
      
      - name: Verify deployment
        run: |
          sleep 10
          curl -f https://${{ secrets.DENO_PROJECT }}.deno.dev/health || exit 1
